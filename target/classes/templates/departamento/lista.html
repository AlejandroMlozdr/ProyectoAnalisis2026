<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Departamentos</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-diagram-3"></i> Departamentos</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/departamento/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/departamento')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/departamento/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/departamento')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/departamento/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/departamento')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th>Empresa</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.nombre}"></td>
                        <td th:text="${item.empresa?.nombre}"></td>
                        <td class="text-end">
                            <a th:href="@{/departamento/editar/{id}(id=${item.idDepartamento})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/departamento')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/departamento/eliminar/{id}(id=${item.idDepartamento})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/departamento')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="3" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
