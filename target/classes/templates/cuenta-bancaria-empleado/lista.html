<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Cuentas Bancarias de Empleados</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-credit-card-2-front"></i> Cuentas Bancarias de Empleados</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/cuenta-bancaria-empleado/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/cuenta-bancaria-empleado')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/cuenta-bancaria-empleado/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/cuenta-bancaria-empleado')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/cuenta-bancaria-empleado/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/cuenta-bancaria-empleado')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Empleado</th><th>Banco</th><th>Número de cuenta</th><th>Cuenta activa</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.empleado?.persona?.nombre + ' ' + item.empleado?.persona?.apellido}"></td>
                        <td th:text="${item.banco?.nombre}"></td>
                        <td th:text="${item.numeroDeCuenta}"></td>
                        <td><span class="badge" th:classappend="${item.activaMarcada} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${item.activaMarcada} ? 'Activa' : 'Inactiva'"></span></td>
                        <td class="text-end">
                            <a th:href="@{/cuenta-bancaria-empleado/editar/{id}(id=${item.idCuentaBancaria})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/cuenta-bancaria-empleado')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/cuenta-bancaria-empleado/eliminar/{id}(id=${item.idCuentaBancaria})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/cuenta-bancaria-empleado')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
