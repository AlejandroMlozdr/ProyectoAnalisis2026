<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Cuenta Bancaria</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3"><i class="bi bi-credit-card-2-front"></i> <span th:text="${item.idCuentaBancaria} != null ? 'Editar Cuenta Bancaria' : 'Nuevo Cuenta Bancaria'"></span></h3>
        <div class="card shadow-sm" style="max-width: 650px;">
            <div class="card-body">
                <form th:action="@{/cuenta-bancaria-empleado/guardar}" th:object="${item}" method="post">
                    <input type="hidden" th:field="*{idCuentaBancaria}" />
                    <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="empleado">Empleado</label>
                        <select name="empleado" id="empleado" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${empleadoOpciones}" th:value="${o.idEmpleado}" th:text="${o.persona.nombre + ' ' + o.persona.apellido}"
                                    th:selected="${item.empleado != null and item.empleado.idEmpleado == o.idEmpleado}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="banco">Banco</label>
                        <select name="banco" id="banco" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${bancoOpciones}" th:value="${o.idBanco}" th:text="${o.nombre}"
                                    th:selected="${item.banco != null and item.banco.idBanco == o.idBanco}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="numeroDeCuenta">Número de cuenta</label>
                        <input type="text" th:field="*{numeroDeCuenta}" class="form-control" maxlength="50" required />
                    </div>
                    <div class="col-md-6">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" name="activa" id="activa" value="1" th:checked="${item.activaMarcada}">
                            <label class="form-check-label" for="activa">Cuenta activa</label>
                        </div>
                    </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/cuenta-bancaria-empleado}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
