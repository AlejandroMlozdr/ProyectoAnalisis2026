<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Usuarios</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-person-lines-fill"></i> Usuarios</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/usuario/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/usuario')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/usuario/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/usuario')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/usuario/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/usuario')}">
                    <i class="bi bi-plus-lg"></i> Nuevo Usuario
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Sucursal</th>
                        <th>Rol</th>
                        <th>Estatus</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.idUsuario}"></td>
                        <td th:text="${u.nombre} + ' ' + ${u.apellido}"></td>
                        <td th:text="${u.correoElectronico}"></td>
                        <td th:text="${u.sucursal.nombre}"></td>
                        <td th:text="${u.role.nombre}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.statusUsuario.nombre == 'Activo'} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${u.statusUsuario.nombre}"></span>
                            <span class="badge text-bg-warning" title="Debe cambiar su contraseña en el próximo inicio de sesión"
                                  th:if="${u.requiereCambiarPassword != null and u.requiereCambiarPassword == 1}">
                                <i class="bi bi-clock-history"></i> Password vencida
                            </span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/usuario/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/usuario')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/usuario/caducar-password/{id}(id=${u.idUsuario})}" method="post" class="d-inline" th:if="${@permisoService.puedeCambio('/usuario')}">
                                <button type="submit" class="btn btn-sm btn-outline-warning" title="Forzar cambio de contraseña"
                                        onclick="return confirm('¿Forzar el cambio de contraseña de este usuario? Deberá cambiarla en su próximo inicio de sesión.');">
                                    <i class="bi bi-clock-history"></i>
                                </button>
                            </form>
                            <form th:action="@{/usuario/eliminar/{id}(id=${u.idUsuario})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/usuario')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este usuario?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7" class="text-center text-muted py-4">No hay usuarios registrados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
