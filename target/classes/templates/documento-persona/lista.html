<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Documentos de Personas</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-file-earmark-person"></i> Documentos de Personas</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/documento-persona/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/documento-persona')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/documento-persona/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/documento-persona')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/documento-persona/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/documento-persona')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Persona</th><th>Tipo de documento</th><th>Número de documento</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.persona?.nombre + ' ' + item.persona?.apellido}"></td>
                        <td th:text="${item.tipoDocumento?.nombre}"></td>
                        <td th:text="${item.noDocumento}"></td>
                        <td class="text-end">
                            <a th:href="@{/documento-persona/editar/{a}/{b}(a=${item.persona.idPersona},b=${item.tipoDocumento.idTipoDocumento})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/documento-persona')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/documento-persona/eliminar/{a}/{b}(a=${item.persona.idPersona},b=${item.tipoDocumento.idTipoDocumento})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/documento-persona')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="4" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
