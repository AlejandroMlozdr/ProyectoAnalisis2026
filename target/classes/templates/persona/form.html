<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Persona</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3"><i class="bi bi-person-vcard"></i> <span th:text="${item.idPersona} != null ? 'Editar Persona' : 'Nuevo Persona'"></span></h3>
        <div class="card shadow-sm" style="max-width: 900px;">
            <div class="card-body">
                <form th:action="@{/persona/guardar}" th:object="${item}" method="post">
                    <input type="hidden" th:field="*{idPersona}" />
                    <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" maxlength="50" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="apellido">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control" maxlength="50" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="genero">Género</label>
                        <select name="genero" id="genero" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${generoOpciones}" th:value="${o.idGenero}" th:text="${o.nombre}"
                                    th:selected="${item.genero != null and item.genero.idGenero == o.idGenero}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control" maxlength="100" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" maxlength="50" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="correoElectronico">Correo electrónico</label>
                        <input type="text" th:field="*{correoElectronico}" class="form-control" maxlength="50" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="estadoCivil">Estado civil</label>
                        <select name="estadoCivil" id="estadoCivil" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${estadoCivilOpciones}" th:value="${o.idEstadoCivil}" th:text="${o.nombre}"
                                    th:selected="${item.estadoCivil != null and item.estadoCivil.idEstadoCivil == o.idEstadoCivil}"></option>
                        </select>
                    </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/persona}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
