<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Flujos Status Empleado</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-diagram-2"></i> Flujos Status Empleado</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/flujo-status-empleado/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/flujo-status-empleado')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/flujo-status-empleado/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/flujo-status-empleado')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/flujo-status-empleado/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/flujo-status-empleado')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Status actual</th><th>Status nuevo</th><th>Nombre del evento</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.statusActual?.nombre}"></td>
                        <td th:text="${item.statusNuevo?.nombre}"></td>
                        <td th:text="${item.nombreEvento}"></td>
                        <td class="text-end">
                            <a th:href="@{/flujo-status-empleado/editar/{a}/{b}(a=${item.statusActual.idStatusEmpleado},b=${item.statusNuevo.idStatusEmpleado})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/flujo-status-empleado')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/flujo-status-empleado/eliminar/{a}/{b}(a=${item.statusActual.idStatusEmpleado},b=${item.statusNuevo.idStatusEmpleado})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/flujo-status-empleado')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="4" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
