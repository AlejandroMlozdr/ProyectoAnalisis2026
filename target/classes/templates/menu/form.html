<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Menú</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3"><i class="bi bi-list-nested"></i> <span th:text="${menu.idMenu} != null ? 'Editar Menú' : 'Nuevo Menú'"></span></h3>
        <div class="card shadow-sm" style="max-width: 600px;">
            <div class="card-body">
                <form th:action="@{/menu/guardar}" th:object="${menu}" method="post">
                    <input type="hidden" th:field="*{idMenu}" />

                    <div class="mb-3">
                        <label class="form-label">Módulo</label>
                        <select th:field="*{modulo}" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="mod : ${modulos}" th:value="${mod.idModulo}" th:text="${mod.nombre}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Orden</label>
                        <input type="number" th:field="*{ordenMenu}" class="form-control" required />
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/menu}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
