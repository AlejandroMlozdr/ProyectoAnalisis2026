<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Menús</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-list-nested"></i> Menús</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/menu/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/menu')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/menu/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/menu')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/menu/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/menu')}">
                    <i class="bi bi-plus-lg"></i> Nuevo Menú
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th>Módulo</th><th>Orden</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="m : ${menus}">
                        <td th:text="${m.nombre}"></td>
                        <td th:text="${m.modulo.nombre}"></td>
                        <td th:text="${m.ordenMenu}"></td>
                        <td class="text-end">
                            <a th:href="@{/menu/editar/{id}(id=${m.idMenu})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/menu')}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/menu/eliminar/{id}(id=${m.idMenu})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/menu')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(menus)}"><td colspan="4" class="text-center text-muted py-4">No hay menús registrados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
