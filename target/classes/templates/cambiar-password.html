<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar Contraseña - Sistema de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background-color: #212529;
        }
        .login-card { max-width: 380px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card mx-auto">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-exclamation fs-1 text-warning"></i>
                        <h4 class="mt-2 mb-0">Contraseña Vencida</h4>
                        <small class="text-muted">Debe establecer una nueva contraseña para continuar</small>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/cambiar-password}" method="post">
                        <input type="hidden" name="usuario" th:value="${usuario}" />

                        <div class="mb-2">
                            <label class="form-label small text-muted">Usuario</label>
                            <input type="text" class="form-control" th:value="${usuario}" disabled />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña actual</label>
                            <input type="password" name="passwordActual" class="form-control" required autofocus />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="passwordNueva" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar nueva contraseña</label>
                            <input type="password" name="passwordConfirmacion" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
