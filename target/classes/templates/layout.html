<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Sistema de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
            border-radius: .25rem;
        }
        .sidebar .nav-link i {
            width: 20px;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar d-flex flex-column flex-shrink-0 p-3" style="width: 260px;">
            <a href="/consola" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-shield-lock-fill me-2 fs-4"></i>
                <span class="fs-5 fw-semibold">Módulo Seguridad</span>
            </a>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <!-- Consola siempre visible: es la pagina de bienvenida, no depende de permisos -->
                <li class="nav-item"><a th:href="@{/consola}" class="nav-link"><i class="bi bi-house-door"></i> Consola</a></li>

                <!--
                  Menu dinamico: recorre Modulo -> Menu -> Opcion, ya filtrado por
                  PermisoService segun lo que el rol del usuario autenticado tiene
                  asignado en ROLE_OPCION (ver MenuGlobalAdvice, que agrega
                  "menuLateral" al Model en cada request).
                -->
                <th:block th:each="modulo : ${menuLateral}">
                    <th:block th:each="menu : ${modulo.menus}">
                        <li class="nav-item mt-3" th:if="${not #lists.isEmpty(menu.opciones)}">
                            <span class="text-secondary text-uppercase small px-2" th:text="${menu.nombre}"></span>
                        </li>
                        <li class="nav-item" th:each="opcion : ${menu.opciones}">
                            <a th:href="@{${opcion.pagina}}" class="nav-link">
                                <i th:class="'bi ' + ${opcion.icono}"></i>
                                <span th:text="${opcion.nombre}"></span>
                            </a>
                        </li>
                    </th:block>
                </th:block>

                <!-- La bitacora de auditoria no es una Opcion del RBAC (ver README); solo la ve ADMINISTRADOR -->
                <li class="nav-item mt-3" sec:authorize="hasRole('ADMINISTRADOR')">
                    <span class="text-secondary text-uppercase small px-2">Estadísticas</span>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a th:href="@{/auditoria}" class="nav-link"><i class="bi bi-clipboard-data"></i> Bitácora de Accesos</a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="dropdown">
                <a th:href="@{/perfil}" class="d-flex align-items-center text-white text-decoration-none">
                    <i class="bi bi-person-circle fs-4 me-2"></i>
                    <span sec:authentication="name">Usuario</span>
                </a>
                <a th:href="@{/perfil}" class="btn btn-outline-light btn-sm w-100 mt-2">
                    <i class="bi bi-person-gear"></i> Mi Perfil
                </a>
                <form th:action="@{/logout}" method="post" class="mt-2">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </nav>

        <!-- Contenido -->
        <main class="flex-grow-1 p-4">
            <!--
              Mensajes flash globales (exito/error), para no tener que repetirlos
              en cada lista.html/form.html. Los controladores los agregan con
              RedirectAttributes.addFlashAttribute("exito"/"error", "..."); ej.
              GlobalExceptionHandler los usa para avisar que no se pudo eliminar
              un registro por tener dependencias.
            -->
            <div class="alert alert-success alert-dismissible fade show" th:if="${exito}">
                <span th:text="${exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div layout:fragment="content">
                <!-- contenido de cada pantalla va aqui -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
