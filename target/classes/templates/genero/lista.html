<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Géneros</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-people"></i> Géneros</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/genero/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/genero')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/genero/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/genero')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/genero/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/genero')}">
                    <i class="bi bi-plus-lg"></i> Nuevo Género
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="g : ${generos}">
                        <td th:text="${g.nombre}"></td>
                        <td class="text-end">
                            <a th:href="@{/genero/editar/{id}(id=${g.idGenero})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/genero')}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/genero/eliminar/{id}(id=${g.idGenero})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/genero')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(generos)}"><td colspan="2" class="text-center text-muted py-4">No hay géneros registrados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
