<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Auditoría de Accesos</title>

    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <style>
        .badge-acceso { background-color: #28a745; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-bloqueado { background-color: #dc3545; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-error { background-color: #ffc107; color: #212529; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-inactivo { background-color: #17a2b8; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-noexiste { background-color: #6c757d; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-logout { background-color: #6f42c1; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-expirada { background-color: #fd7e14; color: white; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .ip-code { background: #e9ecef; padding: 3px 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; color: #212529; }
        .filtros { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #e9ecef; }
        .filtros .form-label { font-weight: 600; font-size: 13px; color: #495057; }
        .table-audit { font-size: 14px; }
        .table-audit thead th { background-color: #2c3e50; color: white; white-space: nowrap; padding: 12px 10px; font-weight: 600; font-size: 13px; }
        .table-audit tbody td { padding: 10px 10px; vertical-align: middle; }
        .table-audit tbody tr:hover { background-color: #e8f0fe; }
        .estado-vacio { padding: 40px 0; text-align: center; color: #6c757d; }
        .estado-vacio i { font-size: 48px; margin-bottom: 15px; color: #dee2e6; }
        @media (max-width: 768px) {
            .table-audit { font-size: 12px; }
            .table-audit thead th { font-size: 11px; padding: 8px 6px; }
            .table-audit tbody td { padding: 8px 6px; }
        }
    </style>
</head>

<body>

    <div layout:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">
                <i class="bi bi-clipboard-data"></i> Auditoría de Accesos
                <span class="badge bg-secondary ms-2" th:text="${#lists.size(registros)}">0</span>
            </h3>
            <div>
                <a th:href="@{/auditoria}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="filtros">
                    <form th:action="@{/auditoria}" method="get" class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label"><i class="bi bi-person"></i> Usuario</label>
                            <input type="text" class="form-control" name="usuario" th:value="${param.usuario}" placeholder="Buscar usuario...">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label"><i class="bi bi-calendar"></i> Desde</label>
                            <input type="date" class="form-control" name="desde" th:value="${param.desde}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label"><i class="bi bi-calendar"></i> Hasta</label>
                            <input type="date" class="form-control" name="hasta" th:value="${param.hasta}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label"><i class="bi bi-wifi"></i> IP</label>
                            <input type="text" class="form-control" name="ip" th:value="${param.ip}" placeholder="Ej: 192.168">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </form>
                </div>

                <div class="table-responsive">
                    <table id="tablaAuditoria" class="table table-hover align-middle mb-0 table-audit">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Usuario</th>
                                <th>Tipo Acceso</th>
                                <th>Fecha/Hora</th>
                                <th>IP</th>
                                <th>Detalle</th>
                                <th>Navegador</th>
                                <th>SO</th>
                                <th>Dispositivo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reg, stat : ${registros}">
                                <td th:text="${stat.index + 1}"></td>
                                <td><strong th:text="${reg.usuario != null ? reg.usuario.idUsuario : '(desconocido)'}"></strong></td>
                                <td>
                                    <span class="badge"
                                          th:with="nombreTipo=${reg.tipoAcceso != null ? reg.tipoAcceso.nombre : ''}"
                                          th:classappend="${nombreTipo == 'Acceso Concedido' ? 'badge-acceso' :
                                                          nombreTipo == 'Login fallido' ? 'badge-error' :
                                                          nombreTipo == 'Bloqueado por intentos de acceso' ? 'badge-bloqueado' :
                                                          nombreTipo == 'Usuario inactivo' ? 'badge-inactivo' :
                                                          nombreTipo == 'Usuario no existe' ? 'badge-noexiste' :
                                                          nombreTipo == 'Logout' ? 'badge-logout' :
                                                          nombreTipo == 'Sesion expirada por inactividad' ? 'badge-expirada' :
                                                          'bg-secondary'}">
                                        <span th:text="${reg.tipoAcceso != null ? reg.tipoAcceso.nombre : 'Desconocido'}"></span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(reg.fechaAcceso, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                <td><span class="ip-code" th:text="${reg.direccionIp != null ? reg.direccionIp : '-'}"></span></td>
                                <td th:text="${reg.acceso != null ? reg.acceso : '-'}"></td>
                                <td th:text="${reg.browser != null ? reg.browser : '-'}"></td>
                                <td th:text="${reg.sistemaOperativo != null ? reg.sistemaOperativo : '-'}"></td>
                                <td th:text="${reg.dispositivo != null ? reg.dispositivo : '-'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(registros)}">
                                <td colspan="9">
                                    <div class="estado-vacio">
                                        <i class="bi bi-inbox"></i>
                                        <p class="h5">No se encontraron registros</p>
                                        <p class="text-muted">La bitácora de auditoría está vacía</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3">
                    <span class="badge bg-primary">
                        <i class="bi bi-database me-1"></i>
                        Total: <span th:text="${#lists.size(registros)}">0</span> registros
                    </span>
                </div>

            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
        <script>
            $(document).ready(function () {
                var tabla = $('#tablaAuditoria');
                if (tabla.find('tbody tr').length > 0) {
                    tabla.DataTable({
                        pageLength: 10,
                        order: [[3, "desc"]],
                        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
                        columnDefs: [{ orderable: false, targets: [0, 5, 6, 7, 8] }]
                    });
                }
            });
        </script>
    </th:block>

</body>
</html>
