<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Empresas</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-building"></i> Empresas</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/empresa/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/empresa')}">
                    <i class="bi bi-file-earmark-pdf"></i> Imprimir
                </a>
                <a th:href="@{/empresa/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/empresa')}">
                    <i class="bi bi-file-earmark-excel"></i> Exportar
                </a>
                <a th:href="@{/empresa/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/empresa')}">
                    <i class="bi bi-plus-lg"></i> Nueva Empresa
                </a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>NIT</th>
                        <th>Dirección</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="empresa : ${empresas}">
                        <td th:text="${empresa.nombre}"></td>
                        <td th:text="${empresa.nit}"></td>
                        <td th:text="${empresa.direccion}"></td>
                        <td class="text-end">
                            <a th:href="@{/empresa/editar/{id}(id=${empresa.idEmpresa})}"
                               class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/empresa')}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/empresa/eliminar/{id}(id=${empresa.idEmpresa})}"
                                  method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/empresa')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('¿Eliminar esta empresa?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(empresas)}">
                        <td colspan="4" class="text-center text-muted py-4">No hay empresas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
