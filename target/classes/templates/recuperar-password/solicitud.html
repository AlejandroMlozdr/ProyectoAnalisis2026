<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - Sistema de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; background-color: #212529; }
        .recovery-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="recovery-card mx-auto">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill fs-1 text-primary"></i>
                    <h4 class="mt-2 mb-1">Recuperar contraseña</h4>
                    <small class="text-muted">Ingrese su nombre de usuario</small>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 small" role="alert"
                     th:text="${error}"></div>

                <form th:action="@{/recuperar-password/buscar}" method="post">
                    <div class="mb-3">
                        <label for="idUsuario" class="form-label">Usuario</label>
                        <input id="idUsuario" type="text" name="idUsuario" class="form-control"
                               th:value="${idUsuario}" required autofocus autocomplete="username">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Continuar</button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="small">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
