<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña - Sistema de Seguridad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; background-color: #212529; }
        .recovery-card { max-width: 460px; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <div class="recovery-card mx-auto">
        <div class="card shadow">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
                    <h4 class="mt-2 mb-1">Establecer contraseña nueva</h4>
                    <small class="text-muted">Usuario: <span th:text="${idUsuario}"></span></small>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 small" role="alert"
                     th:text="${error}"></div>

                <form th:action="@{/recuperar-password/restablecer}" method="post">
                    <div class="mb-3">
                        <label for="respuesta" class="form-label">Pregunta de seguridad</label>
                        <p class="form-control-plaintext fw-semibold" th:text="${pregunta}"></p>
                        <input id="respuesta" type="password" name="respuesta" class="form-control"
                               placeholder="Escriba su respuesta" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label for="nuevaPassword" class="form-label">Contraseña nueva</label>
                        <input id="nuevaPassword" type="password" name="nuevaPassword"
                               class="form-control" required autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                        <input id="confirmarPassword" type="password" name="confirmarPassword"
                               class="form-control" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/recuperar-password}" class="small">Iniciar nuevamente</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
