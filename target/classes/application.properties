# ---------- Conexion a base de datos ----------
spring.datasource.url=jdbc:mysql://localhost:3306/ProyectoAnalisis?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=osito
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# Las tablas YA EXISTEN en la base de datos (ver script SQL del proyecto),
# asi que Hibernate NO debe crearlas ni modificarlas. "validate" revisa al
# arrancar que las entidades coincidan con las tablas reales; si algo no
# cuadra, la app no arranca y dice por que. Cuando confien en que todo esta
# correcto, pueden cambiarlo a "none".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANTE: por defecto Spring Boot convierte los nombres de los campos Java
# a snake_case (ej. idEmpresa -> id_empresa). Como las tablas del script usan
# PascalCase (IdEmpresa, PasswordCantidadMayusculas, etc.), esta linea desactiva
# esa conversion para que Hibernate use el nombre del campo/columna tal cual.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Servidor ----------
server.port=8086

# ---------- Gestion de sesiones ----------
# Minutos de inactividad antes de cerrar la sesion automaticamente.
# Cambiar solo este valor para ajustar el timeout (ej. 15 o 30 en produccion).
seguridad.sesion.timeout-minutos=5
server.servlet.session.timeout=${seguridad.sesion.timeout-minutos}m

# ---------- Logs ----------
logging.level.org.springframework.security=INFO
