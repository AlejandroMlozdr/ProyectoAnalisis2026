<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Personas</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-person-vcard"></i> Personas</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/persona/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/persona')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/persona/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/persona')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/persona/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/persona')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th>Apellido</th><th>Fecha de nacimiento</th><th>Género</th><th>Teléfono</th><th>Correo electrónico</th><th>Estado civil</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.nombre}"></td>
                        <td th:text="${item.apellido}"></td>
                        <td th:text="${#temporals.format(item.fechaNacimiento,'dd/MM/yyyy')}"></td>
                        <td th:text="${item.genero?.nombre}"></td>
                        <td th:text="${item.telefono}"></td>
                        <td th:text="${item.correoElectronico}"></td>
                        <td th:text="${item.estadoCivil?.nombre}"></td>
                        <td class="text-end">
                            <a th:href="@{/persona/editar/{id}(id=${item.idPersona})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/persona')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/persona/eliminar/{id}(id=${item.idPersona})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/persona')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
