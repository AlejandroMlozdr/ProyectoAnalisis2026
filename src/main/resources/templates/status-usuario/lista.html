<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Estatus de Usuario</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-person-check"></i> Estatus de Usuario</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/status-usuario/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/status-usuario')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/status-usuario/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/status-usuario')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/status-usuario/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/status-usuario')}">
                    <i class="bi bi-plus-lg"></i> Nuevo Estatus
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${statusList}">
                        <td th:text="${s.nombre}"></td>
                        <td class="text-end">
                            <a th:href="@{/status-usuario/editar/{id}(id=${s.idStatusUsuario})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/status-usuario')}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/status-usuario/eliminar/{id}(id=${s.idStatusUsuario})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/status-usuario')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(statusList)}"><td colspan="2" class="text-center text-muted py-4">No hay estatus registrados.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
