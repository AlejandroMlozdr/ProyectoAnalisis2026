<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Liquidación de Empleado</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-box-arrow-right"></i> Liquidación de Empleado</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/liquidacion/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/liquidacion')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/liquidacion/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/liquidacion')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/liquidacion/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/liquidacion')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Empleado</th><th>Fecha de egreso</th><th>Fecha de liquidación</th><th>Motivo de egreso</th><th class="text-end">Salario neto</th><th class="text-end">Total ingresos</th><th class="text-end">Total descuentos</th><th class="text-end">Total neto</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.empleado?.persona?.nombre + ' ' + item.empleado?.persona?.apellido}"></td>
                        <td th:text="${#temporals.format(item.fechaEgreso,'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(item.fechaLiquidacion,'dd/MM/yyyy')}"></td>
                        <td th:text="${item.motivoEgreso}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.salarioNeto,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.totalIngresos,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.totalDescuentos,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.totalNeto,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/liquidacion/exportar-pdf/{id}(id=${item.idLiquidacion})}" class="btn btn-sm btn-outline-danger" th:if="${@permisoService.puedeImprimir('/liquidacion')}" title="Finiquito PDF"><i class="bi bi-file-earmark-pdf"></i></a>
                            <a th:href="@{/liquidacion/editar/{id}(id=${item.idLiquidacion})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/liquidacion')}" title="Editar"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="9" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
