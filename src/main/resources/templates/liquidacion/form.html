<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Liquidación</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3"><i class="bi bi-box-arrow-right"></i> <span th:text="${item.idLiquidacion} != null ? 'Editar Liquidación' : 'Nuevo Liquidación'"></span></h3>
        <div class="card shadow-sm" style="max-width: 900px;">
            <div class="card-body">
                <form th:action="@{/liquidacion/guardar}" th:object="${item}" method="post">
                    <input type="hidden" th:field="*{idLiquidacion}" />
                    <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="empleado">Empleado</label>
                        <select name="empleado" id="empleado" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${empleadoOpciones}" th:value="${o.idEmpleado}" th:text="${o.persona.nombre + ' ' + o.persona.apellido}"
                                    th:selected="${item.empleado != null and item.empleado.idEmpleado == o.idEmpleado}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="puesto">Puesto</label>
                        <select name="puesto" id="puesto" class="form-select" required>
                            <option value="">-- Seleccione --</option>
                            <option th:each="o : ${puestoOpciones}" th:value="${o.idPuesto}" th:text="${o.nombre}"
                                    th:selected="${item.puesto != null and item.puesto.idPuesto == o.idPuesto}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fechaContratacion">Fecha de contratación</label>
                        <input type="date" th:field="*{fechaContratacion}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fechaEgreso">Fecha de egreso</label>
                        <input type="date" th:field="*{fechaEgreso}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fechaLiquidacion">Fecha de liquidación</label>
                        <input type="date" th:field="*{fechaLiquidacion}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="motivoEgreso">Motivo de egreso</label>
                        <input type="text" th:field="*{motivoEgreso}" class="form-control" maxlength="50" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ingresoSueldoBase">Sueldo base</label>
                        <input type="number" step="0.01" min="0" th:field="*{ingresoSueldoBase}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ingresoBonificacionDecreto">Bonificación Decreto</label>
                        <input type="number" step="0.01" min="0" th:field="*{ingresoBonificacionDecreto}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="ingresoOtrosIngresos">Otros ingresos</label>
                        <input type="number" step="0.01" min="0" th:field="*{ingresoOtrosIngresos}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descuentoIgss">Descuento IGSS</label>
                        <input type="number" step="0.01" min="0" th:field="*{descuentoIgss}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descuentoIsr">Descuento ISR</label>
                        <input type="number" step="0.01" min="0" th:field="*{descuentoIsr}" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descuentoInasistencias">Descuento por inasistencias</label>
                        <input type="number" step="0.01" min="0" th:field="*{descuentoInasistencias}" class="form-control" required />
                    </div>
                    </div>
                    <div class="alert alert-secondary mt-4 mb-0">
                        <div class="small text-muted mb-2">Resumen (se calcula y se guarda al presionar Guardar)</div>
                        <div class="row text-center">
                            <div class="col-4"><div class="small text-muted">Total ingresos</div><div class="fw-semibold" id="totIngresos">Q 0.00</div></div>
                            <div class="col-4"><div class="small text-muted">Total descuentos</div><div class="fw-semibold" id="totDescuentos">Q 0.00</div></div>
                            <div class="col-4"><div class="small text-muted">Total neto</div><div class="fw-bold text-success" id="totNeto">Q 0.00</div></div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/liquidacion}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script>
            (function () {
                var ingresos = ['ingresoSueldoBase', 'ingresoBonificacionDecreto', 'ingresoOtrosIngresos'];
                var descuentos = ['descuentoIgss', 'descuentoIsr', 'descuentoInasistencias'];

                function valor(id) {
                    var el = document.getElementById(id);
                    var n = parseFloat(el ? el.value : '');
                    return isNaN(n) ? 0 : n;
                }
                function suma(ids) {
                    var t = 0;
                    ids.forEach(function (id) { t += valor(id); });
                    return t;
                }
                function dinero(n) {
                    return 'Q ' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                }
                function recalcular() {
                    var ti = suma(ingresos), td = suma(descuentos);
                    document.getElementById('totIngresos').textContent = dinero(ti);
                    document.getElementById('totDescuentos').textContent = dinero(td);
                    document.getElementById('totNeto').textContent = dinero(ti - td);
                }

                ingresos.concat(descuentos).forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el) el.addEventListener('input', recalcular);
                });
                recalcular();

                // Al elegir un empleado se precargan sus datos laborales y salariales
                document.getElementById('empleado').addEventListener('change', async function () {
                    if (!this.value) return;
                    try {
                        var resp = await fetch('/liquidacion/datos-empleado/' + this.value);
                        var d = await resp.json();
                        var poner = function (id, v) {
                            var el = document.getElementById(id);
                            if (el && v !== undefined && v !== null) el.value = v;
                        };
                        poner('fechaContratacion', d.fechaContratacion);
                        poner('puesto', d.idPuesto);
                        poner('ingresoSueldoBase', d.sueldoBase);
                        poner('ingresoBonificacionDecreto', d.bonificacion);
                        poner('ingresoOtrosIngresos', d.otrosIngresos);
                        poner('descuentoIgss', d.igss);
                        poner('descuentoIsr', d.isr);
                        poner('descuentoInasistencias', d.inasistencias);
                        recalcular();
                    } catch (e) {
                        console.error('No se pudieron cargar los datos del empleado', e);
                    }
                });
            })();
        </script>
    </th:block>
</body>
</html>
