<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Módulo</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3"><i class="bi bi-grid-3x3-gap"></i> <span th:text="${modulo.idModulo} != null ? 'Editar Módulo' : 'Nuevo Módulo'"></span></h3>
        <div class="card shadow-sm" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/modulo/guardar}" th:object="${modulo}" method="post">
                    <input type="hidden" th:field="*{idModulo}" />
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Orden en el menú</label>
                        <input type="number" th:field="*{ordenMenu}" class="form-control" required />
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/modulo}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
