<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Inasistencias de Empleados</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-calendar-x"></i> Inasistencias de Empleados</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/inasistencia/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/inasistencia')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/inasistencia/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/inasistencia')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/inasistencia/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/inasistencia')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Empleado</th><th>Fecha inicial</th><th>Fecha final</th><th>Motivo</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.empleado?.persona?.nombre + ' ' + item.empleado?.persona?.apellido}"></td>
                        <td th:text="${#temporals.format(item.fechaInicial,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${#temporals.format(item.fechaFinal,'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${item.motivoInasistencia}"></td>
                        <td>
                            <span th:if="${item.fechaProcesado == null}" class="badge bg-warning text-dark">Pendiente</span>
                            <span th:if="${item.fechaProcesado != null}" class="badge bg-success"
                                  th:text="${'Procesada ' + #temporals.format(item.fechaProcesado,'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td class="text-end">
                            <span th:if="${item.fechaProcesado != null}" class="text-muted small" title="Ya fue considerada en una planilla o liquidación"><i class="bi bi-lock"></i></span>
                            <a th:href="@{/inasistencia/editar/{id}(id=${item.idInasistencia})}" class="btn btn-sm btn-outline-secondary" th:if="${item.fechaProcesado == null and @permisoService.puedeCambio('/inasistencia')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/inasistencia/eliminar/{id}(id=${item.idInasistencia})}" method="post" class="d-inline" th:if="${item.fechaProcesado == null and @permisoService.puedeBaja('/inasistencia')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="6" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
