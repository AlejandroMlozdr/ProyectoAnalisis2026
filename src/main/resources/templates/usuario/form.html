<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Formulario Usuario</title></head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-3">
            <i class="bi bi-person-lines-fill"></i>
            <span th:text="${esNuevo} ? 'Nuevo Usuario' : 'Editar Usuario'"></span>
        </h3>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Usuario (login)</label>
                            <input type="text" th:field="*{idUsuario}" class="form-control"
                                   th:readonly="${!esNuevo}" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Apellido</label>
                            <input type="text" th:field="*{apellido}" class="form-control" required />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" th:field="*{fechaNacimiento}" class="form-control" required />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{correoElectronico}" class="form-control" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Teléfono móvil</label>
                            <input type="text" th:field="*{telefonoMovil}" class="form-control" />
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Empresa</label>
                            <select id="empresaSelect" class="form-select">
                                <option value="">-- Seleccione --</option>
                                <option th:each="e : ${empresas}" th:value="${e.idEmpresa}" th:text="${e.nombre}"
                                        th:selected="${e.idEmpresa == empresaSeleccionada}"></option>
                            </select>
                            <div class="form-text">Filtra las sucursales disponibles abajo.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sucursal</label>
                            <select id="sucursalSelect" th:field="*{sucursal}" class="form-select" required>
                                <option value="">-- Seleccione una empresa primero --</option>
                                <option th:each="s : ${sucursales}" th:value="${s.idSucursal}" th:text="${s.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Rol</label>
                            <select th:field="*{role}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option th:each="r : ${roles}" th:value="${r.idRole}" th:text="${r.nombre}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Género</label>
                            <select th:field="*{genero}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option th:each="g : ${generos}" th:value="${g.idGenero}" th:text="${g.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Estatus</label>
                            <select th:field="*{statusUsuario}" class="form-select" required>
                                <option value="">-- Seleccione --</option>
                                <option th:each="s : ${statusList}" th:value="${s.idStatusUsuario}" th:text="${s.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check">
                                <input type="hidden" name="requiereCambiarPassword" value="0" />
                                <input type="checkbox" id="requiereCambiarPasswordCheck" name="requiereCambiarPassword"
                                       value="1" class="form-check-input"
                                       th:checked="${usuario.requiereCambiarPassword != null and usuario.requiereCambiarPassword == 1}" />
                                <label class="form-check-label" for="requiereCambiarPasswordCheck">Requiere cambiar contraseña</label>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="text-muted mb-3">Contraseña</h6>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">
                                Contraseña
                                <span th:unless="${esNuevo}" class="text-muted">(dejar en blanco para no cambiarla)</span>
                            </label>
                            <input type="password" name="passwordPlano" class="form-control" th:required="${esNuevo}" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Pregunta de recuperación</label>
                            <input type="text" th:field="*{pregunta}" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Respuesta</label>
                            <input type="text" th:field="*{respuesta}" class="form-control" required />
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                        <a th:href="@{/usuario}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const empresaSelect = document.getElementById('empresaSelect');
            const sucursalSelect = document.getElementById('sucursalSelect');

            empresaSelect.addEventListener('change', async function () {
                const idEmpresa = this.value;
                sucursalSelect.innerHTML = '<option value="">Cargando...</option>';
                if (!idEmpresa) {
                    sucursalSelect.innerHTML = '<option value="">-- Seleccione una empresa primero --</option>';
                    return;
                }
                try {
                    const resp = await fetch(`/usuario/sucursales-por-empresa/${idEmpresa}`);
                    const sucursales = await resp.json();
                    sucursalSelect.innerHTML = '<option value="">-- Seleccione --</option>';
                    sucursales.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.idSucursal;
                        opt.textContent = s.nombre;
                        sucursalSelect.appendChild(opt);
                    });
                } catch (e) {
                    sucursalSelect.innerHTML = '<option value="">Error al cargar sucursales</option>';
                }
            });
        </script>
    </th:block>
</body>
</html>
