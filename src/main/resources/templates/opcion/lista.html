<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Opciones</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-ui-checks"></i> Opciones</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/opcion/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/opcion')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/opcion/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/opcion')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/opcion/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/opcion')}">
                    <i class="bi bi-plus-lg"></i> Nueva Opción
                </a>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Nombre</th><th>Menú</th><th>Página</th><th>Orden</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="o : ${opciones}">
                        <td th:text="${o.nombre}"></td>
                        <td th:text="${o.menu.nombre}"></td>
                        <td th:text="${o.pagina}"></td>
                        <td th:text="${o.ordenMenu}"></td>
                        <td class="text-end">
                            <a th:href="@{/opcion/editar/{id}(id=${o.idOpcion})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/opcion')}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/opcion/eliminar/{id}(id=${o.idOpcion})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/opcion')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(opciones)}"><td colspan="5" class="text-center text-muted py-4">No hay opciones registradas.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
