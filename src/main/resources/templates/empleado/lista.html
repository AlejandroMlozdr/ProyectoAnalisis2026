<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head><title>Empleados</title></head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"><i class="bi bi-person-workspace"></i> Empleados</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/empleado/exportar-pdf}" class="btn btn-outline-danger" th:if="${@permisoService.puedeImprimir('/empleado')}"><i class="bi bi-file-earmark-pdf"></i> Imprimir</a>
                <a th:href="@{/empleado/exportar-excel}" class="btn btn-outline-success" th:if="${@permisoService.puedeExportar('/empleado')}"><i class="bi bi-file-earmark-excel"></i> Exportar</a>
                <a th:href="@{/empleado/nuevo}" class="btn btn-primary" th:if="${@permisoService.puedeAlta('/empleado')}"><i class="bi bi-plus-lg"></i> Nuevo</a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Persona</th><th>Sucursal</th><th>Fecha de contratación</th><th>Puesto</th><th>Status</th><th class="text-end">Sueldo base</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td th:text="${item.persona?.nombre + ' ' + item.persona?.apellido}"></td>
                        <td th:text="${item.sucursal?.nombre}"></td>
                        <td th:text="${#temporals.format(item.fechaContratacion,'dd/MM/yyyy')}"></td>
                        <td th:text="${item.puesto?.nombre}"></td>
                        <td th:text="${item.statusEmpleado?.nombre}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.ingresoSueldoBase,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end">
                            <a th:href="@{/empleado/editar/{id}(id=${item.idEmpleado})}" class="btn btn-sm btn-outline-secondary" th:if="${@permisoService.puedeCambio('/empleado')}" title="Editar"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/empleado/eliminar/{id}(id=${item.idEmpleado})}" method="post" class="d-inline" th:if="${@permisoService.puedeBaja('/empleado')}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Eliminar este registro?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}"><td colspan="7" class="text-center text-muted py-4">No hay registros.</td></tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
